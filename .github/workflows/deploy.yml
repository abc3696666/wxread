name: wxread

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  repository_dispatch:
    # --- 修改点 1: 这里的 types 必须和 Worker 里的 event_type 一致 ---
    types: [run-wxread] 

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead

    steps:
      - name: Set DNS to Google's DNS
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

      - name: Checkout repository
        uses: actions/checkout@v2

      # --- 修改点 2: 加入随机赖床时间 (0 到 25 分钟) ---
      - name: 随机赖床 (0-25分钟)
        run: |
          DELAY_SECONDS=$(( (RANDOM % 1500) + 1 ))
          echo "闹钟响了，准备赖床 $DELAY_SECONDS 秒..."
          sleep $DELAY_SECONDS

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

      - name: Run deployment script
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
          READ_NUM: ${{ vars.READ_NUM }}
        run: |
          python main.py

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
